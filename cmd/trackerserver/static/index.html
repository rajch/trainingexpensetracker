<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
    <div class="container">
        <header>
            <h1>Expense Tracker</h1>
            <div class="header-actions">
                <button id="refresh-banner" class="btn secondary" style="display: none;">New data available -
                    Refresh</button>
                <button id="add-btn" class="btn primary">Add Expense</button>
            </div>
        </header>

        <main>
            <table id="expense-table">
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th class="amount">Amount</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody id="expense-list">
                    <!-- Expenses will be loaded here -->
                </tbody>
            </table>
        </main>
    </div>

    <!-- Modal for Add/Update -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2 id="modal-title">Add Expense</h2>
            <form id="expense-form">
                <input type="hidden" id="expense-id">
                <div class="form-group">
                    <label for="date">Date</label>
                    <input type="date" id="date" required>
                </div>
                <div class="form-group">
                    <label for="description">Description</label>
                    <input type="text" id="description" placeholder="What did you buy?" required>
                </div>
                <div class="form-group">
                    <label for="amount">Amount</label>
                    <input type="number" id="amount" step="0.01" min="0.01" placeholder="0.00" required>
                </div>
                <button type="submit" class="btn primary full-width">Save Expense</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
